name: TEMP HNL VXT NET48 notch compile fix

on:
  push:
    branches:
      - research/vxt-pro-v7-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vxt-pro-v7-bootstrap
          fetch-depth: 0
      - name: Remove invalid struct null check
        shell: python
        run: |
          from pathlib import Path
          p = Path('incubator/hnl-vxt-pro/src/HNL.VXT.Core/Preview/VxtConcaveMainPostProcessor.cs')
          s = p.read_text(encoding='utf-8')
          old = 'if (segment == null || Math.Abs(segment.B.X - segment.A.X) <= MinDrawLength) continue;'
          new = 'if (Math.Abs(segment.B.X - segment.A.X) <= MinDrawLength) continue;'
          assert s.count(old) == 1, f'Expected one invalid Segment2 null check, got {s.count(old)}'
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit compile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incubator/hnl-vxt-pro/src/HNL.VXT.Core/Preview/VxtConcaveMainPostProcessor.cs
          git commit -m "HNL VXT: fix NET48 regional XC Segment2 check"
          git push origin HEAD:research/vxt-pro-v7-bootstrap
