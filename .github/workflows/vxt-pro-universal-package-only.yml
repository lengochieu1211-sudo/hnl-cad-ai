name: HNL VXT Universal Package-Only Beta Gate

on:
  workflow_dispatch:
    inputs:
      certified_run_id:
        description: "Successful Universal Matrix run ID containing beta.1 bridge artifacts"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package-certified-bridges:
    name: Package certified beta.1 2023-2027 bridges into Universal EXE
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VXT_ROOT: ${{ github.workspace }}\incubator\hnl-vxt-pro
      DOWNLOAD_ROOT: ${{ github.workspace }}\universal-downloads
      CERTIFIED_RUN_ID: ${{ inputs.certified_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested certified run ID
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CERTIFIED_RUN_ID) -or $env:CERTIFIED_RUN_ID -notmatch '^\d+$') {
            throw 'certified_run_id must be a numeric successful Universal Matrix run ID.'
          }
          Write-Host "Certified matrix run requested: $env:CERTIFIED_RUN_ID"
      - name: Download certified bridge artifacts from matrix run
        uses: actions/download-artifact@v4
        with:
          pattern: HNL-VXT-Bridge-*
          path: ${{ env.DOWNLOAD_ROOT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CERTIFIED_RUN_ID }}
      - name: Assemble and verify Universal bridge tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $universal = Join-Path $env:VXT_ROOT 'artifacts\universal'
          if (Test-Path $universal) { Remove-Item $universal -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $universal | Out-Null
          $map = @{
            'HNL-VXT-Bridge-2023-NET48' = '2023'
            'HNL-VXT-Bridge-2024-NET48' = '2024'
            'HNL-VXT-Bridge-2025-NET8' = '2025'
            'HNL-VXT-Bridge-2026-pre-1.2-NET8' = '2026-net8'
            'HNL-VXT-Bridge-2026-1.2-plus-NET10' = '2026-net10'
            'HNL-VXT-Bridge-2027-NET10' = '2027'
          }
          foreach ($artifact in $map.Keys) {
            $src = Join-Path $env:DOWNLOAD_ROOT $artifact
            $dst = Join-Path $universal $map[$artifact]
            if (-not (Test-Path $src)) { throw "Missing certified artifact: $src" }
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item (Join-Path $src '*') $dst -Recurse -Force
            foreach ($dllName in @('HNL.VXT.AutoCAD.dll','HNL.VXT.Core.dll','HNL.VXT.UI.dll')) {
              $dll = Join-Path $dst $dllName
              if (-not (Test-Path $dll)) { throw "Missing $dllName in $artifact" }
            }
            $bridge = Join-Path $dst 'HNL.VXT.AutoCAD.dll'
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $bridge))
            if (-not $info.FileVersion.StartsWith('7.0.0.6')) {
              throw "Stale/non-beta bridge in $artifact: $($info.FileVersion)"
            }
          }
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress --limit-output
      - name: Build Universal Setup EXE
        shell: pwsh
        run: '& "$env:VXT_ROOT\scripts\build-universal-installer.ps1" -Root $env:VXT_ROOT'
      - name: Verify Universal beta.1 EXE and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:VXT_ROOT 'artifacts\universal-installer\HNL_VXT_Pro_Universal_Setup_7.0.0-beta.1.exe'
          $sha = "$exe.sha256.txt"
          if (-not (Test-Path $exe)) { throw "Missing Universal EXE: $exe" }
          if (-not (Test-Path $sha)) { throw "Missing SHA256: $sha" }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if (-not $info.FileVersion.StartsWith('7.0.0.6')) { throw "Bad FileVersion: $($info.FileVersion)" }
          $expected = ((Get-Content $sha -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch: expected=$expected actual=$actual" }
          Write-Host "Certified source matrix run: $env:CERTIFIED_RUN_ID"
          Write-Host "Universal EXE FileVersion: $($info.FileVersion)"
          Write-Host "Universal EXE SHA256: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-VXT-Pro-v7.0.0-beta.1-Universal-Setup-CERTIFIED
          path: |
            ${{ env.VXT_ROOT }}/artifacts/universal-installer/HNL_VXT_Pro_Universal_Setup_7.0.0-beta.1.exe
            ${{ env.VXT_ROOT }}/artifacts/universal-installer/HNL_VXT_Pro_Universal_Setup_7.0.0-beta.1.exe.sha256.txt
          retention-days: 14
          if-no-files-found: error
