name: HCE Bootstrap Universal 2023-2027

on:
  push:
    branches: [research/hce-pro-bootstrap]
    paths:
      - 'HCE-PAYLOAD/**'
      - 'HCE-OVERLAY/**'
      - '.github/workflows/hce-bootstrap.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct HCE source payload
        shell: powershell
        run: |
          $parts = Get-ChildItem HCE-PAYLOAD\part-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\hce.zip", $bytes)
          New-Item -ItemType Directory -Force -Path incubator\hnl-ceiling-estimator-pro | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\hce.zip" incubator\hnl-ceiling-estimator-pro -Force

      - name: Inspect original HCE AutoCAD build project for Palette UI gate
        shell: powershell
        run: |
          $root = 'incubator/hnl-ceiling-estimator-pro'
          foreach ($file in @(
            "$root/src/Bridges/AutoCAD2023/HNL.CeilingEstimator.AutoCAD.2023.csproj",
            "$root/src/Bridges/AutoCAD2025/HNL.CeilingEstimator.AutoCAD.2025.csproj",
            "$root/src/HNL.CeilingEstimator.AutoCAD/HNL.CeilingEstimator.AutoCAD.csproj",
            "$root/Directory.Build.props",
            "$root/installer/HNL.CeilingEstimator.Universal.Setup.iss"
          )) {
            if (Test-Path $file) {
              Write-Host "--- HCE_BUILD_INSPECTION: $file"
              Get-Content $file | Select-Object -First 100 | ForEach-Object { Write-Host $_ }
            }
          }

      - name: Apply minimal AutoCAD adapter overlay (Core untouched)
        shell: powershell
        run: |
          $src = 'HCE-OVERLAY/src/HNL.CeilingEstimator.AutoCAD/Commands.cs'
          $dst = 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/Commands.cs'
          if (-not (Test-Path $src)) { throw 'Missing HCE runtime bridge overlay.' }
          Copy-Item $src $dst -Force
          Write-Host 'HCE bridge overlay applied; protected Core and Golden fixtures unchanged.'

      - name: Enable isolated HCE WPF Palette source for five AutoCAD bridge builds
        shell: powershell
        run: |
          $root = 'incubator/hnl-ceiling-estimator-pro'
          $overlay = 'HCE-OVERLAY/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs'
          $dst = "$root/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs"
          if (-not (Test-Path $overlay)) { throw 'Missing HCE palette overlay' }
          Copy-Item $overlay $dst -Force
          $profile = 'HCE-OVERLAY/src/HNL.CeilingEstimator.AutoCAD/HceLegacyProfile.cs'
          if (-not (Test-Path $profile)) { throw 'HCE legacy model missing' }
          Copy-Item $profile "$root/src/HNL.CeilingEstimator.AutoCAD/HceLegacyProfile.cs" -Force
          $projects = @(Get-ChildItem "$root/src/Bridges" -Filter 'HNL.CeilingEstimator.AutoCAD.*.csproj' -Recurse -File)
          if ($projects.Count -ne 5) { throw "Unexpected HCE bridge count: $($projects.Count)" }
          foreach ($p in $projects) {
            $xml = Get-Content $p.FullName -Raw
            if ($xml -match '<UseWPF>') { throw "Unexpected pre-existing WPF property in $($p.Name)" }
            $xml = $xml.Replace('<TargetFramework>', '<UseWPF>true</UseWPF>' + [Environment]::NewLine + '    <TargetFramework>')
            $resource = '<Resource Include="..\..\..\installer\assets\HNL-Logo-Official.png" Link="Assets\HNL-Logo-Official.png" />'
            $xml = $xml.Replace('</Project>', '  <ItemGroup>' + [Environment]::NewLine + '    ' + $resource + [Environment]::NewLine + '  </ItemGroup>' + [Environment]::NewLine + '</Project>')
            [IO.File]::WriteAllText($p.FullName, $xml, [Text.UTF8Encoding]::new($false))
            Write-Host "HCE PALETTE bridge enabled: $($p.Name)"
          }

      - name: Stamp native HCE Palette title and audit no repeated header
        shell: powershell
        run: |
          $uiPath = 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs'
          $ui = [IO.File]::ReadAllText($uiPath)
          if (-not $ui.Contains('HNL HCE Pro | HCE_UPDATED_AT_VN')) { throw 'Missing HCE build-time caption marker' }
          if ($ui.Contains('pack://application:,,,/HNL.CeilingEstimator.AutoCAD;component/Assets/HNL-Logo-Official.png')) { throw 'Redundant HCE Palette logo still present' }
          if ($ui.Contains('titleStack.Children.Add') -or $ui.Contains('footer.Child')) { throw 'Redundant Palette header/footer still present' }
          if (-not $ui.Contains('new PaletteSet(PaletteCaption, PaletteId)')) { throw 'Caption not wired into native AutoCAD PaletteSet' }
          if (-not $ui.Contains('palette.AddVisual(PaletteCaption, view)')) { throw 'HCE tab must reuse the build-time caption' }
          $buildTimeVN = [DateTime]::UtcNow.AddHours(7).ToString('dd/MM/yyyy HH:mm', [Globalization.CultureInfo]::InvariantCulture)
          $ui = $ui.Replace('HCE_UPDATED_AT_VN', $buildTimeVN)
          if ($ui.Contains('HCE_UPDATED_AT_VN')) { throw 'Unstamped HCE Palette title marker' }
          [IO.File]::WriteAllText($uiPath, $ui, [Text.UTF8Encoding]::new($false))
          Write-Host "HCE PALETTE NATIVE TITLE PASS: HNL HCE Pro | $buildTimeVN (UTC+07, build time)"
          Write-Host 'HCE PALETTE HEADER-FOOTER REMOVAL PASS: calculator is sole content element'
          
      - name: Validate HCE WPF templates and Hatch Area safeguards
        shell: powershell
        run: |
          $dir='incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD'
          $ui=Get-Content "$dir/HcePaletteUi.cs" -Raw
          $adapter=Get-Content "$dir/Commands.cs" -Raw
          if(-not $ui.Contains('return BuildCalculationTab();')){throw 'HCE must show calculator directly'}
          if($ui.Contains('tabs.Items.Add(new TabItem')){throw 'Unrelated Framing module tabs must not be attached to HCE layout'}
          foreach($phrase in @('HasNonAdjacentIntersections(segments)','AreaFromBoundary = usedBoundaryArea','native Hatch.Area=NotApplicable','UnitsValue.Millimeters','needsConfirmation = rejected == 0')) {
            if(-not $adapter.Contains($phrase)){throw "Missing safe Hatch.Area or confirmation gate: $phrase"}
          }
          if($adapter.Contains('[Use600/Use610/Cancel]')){throw 'Unexpected old redundant family confirmation prompt'}
          Add-Type -AssemblyName PresentationFramework
          $matches=[regex]::Matches($ui,'const string xaml = @"(.*?)";',[Text.RegularExpressions.RegexOptions]::Singleline)
          if($matches.Count -ne 2){throw "Expected two Framing-style WPF rail templates; found $($matches.Count)"}
          foreach($match in $matches){
            $style=[System.Windows.Markup.XamlReader]::Parse($match.Groups[1].Value)
            if($style -isnot [System.Windows.Style]){throw 'WPF module style parsing returned unexpected type'}
          }
          Write-Host 'HCE WPF XAML PARSE + HATCH AREA/PROMPT GATES PASS'

      - name: Validate HCE pixel scrolling and visible ComboBox chrome
        shell: powershell
        run: |
          $ui=Get-Content 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs' -Raw
          foreach($phrase in @('CanContentScroll = false', 'ComboArrowBackground', 'Resources[typeof(ComboBox)]', "Text='{TemplateBinding SelectionBoxItem}'", "Fill='{DynamicResource PrimaryText}'")) {
            if(-not $ui.Contains($phrase)){throw "Missing scrolling/dropdown visibility contract: $phrase"}
          }
          if ($ui.Contains('DEMTC')) { throw 'Legacy DEMTC label found in the HCE palette UI' }
          if (-not $ui.Contains('var root = Section("02  ')) { throw 'New calculator settings title missing' }
          if ($ui.Contains('MaxWidth = 130')) { throw 'Numeric inputs are still narrower than the dropdown column' }
          $alignedInputs = [regex]::Matches($ui, 'new TextBox\s*\{[^}]*HorizontalAlignment = HorizontalAlignment.Stretch', [Text.RegularExpressions.RegexOptions]::Singleline)
          if ($alignedInputs.Count -lt 2) { throw 'Both numeric TextBoxes must stretch in the shared input column' }
          if ([regex]::Matches($ui, 'new GridLength\(138\)').Count -lt 5) { throw 'Setting labels must have consistent column width' }
          Write-Host 'HCE SMOOTH SCROLL + COMBOBOX VISIBILITY STATIC GATE PASS'

      - name: Verify HCE default palette and calculator route
        shell: powershell
        run: |
          $commands = Get-Content 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/Commands.cs' -Raw
          $ui = Get-Content 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs' -Raw
          if ($commands -notmatch '\[CommandMethod\("HCE", CommandFlags.Modal\)\]') { throw 'HCE command missing' }
          if ($commands -notmatch 'public void Hce\(\) \{ new HcePaletteCommands\(\).Open\(\); \}') { throw 'HCE must open palette' }
          if ($commands -notmatch '\[CommandMethod\("HCECALC", CommandFlags.Modal\)\]') { throw 'HCECALC command missing' }
          if ($commands -notmatch 'public void HceCalculate\(\) \{ RunCeilingEstimator\(\); \}') { throw 'HCECALC must use original engine' }
          if ($ui -notmatch 'CommandButton\([^\r\n]+, "HCECALC", true\)') { throw 'HCE button must calculate, not reopen the palette' }
          Write-Host 'HCE command routing contract PASS: HCE => Palette; HCECALC => existing Core; UI => HCECALC.'

      - name: Validate DCL options restored in WPF UI
        shell: powershell
        run: |
          $ui = Get-Content 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs' -Raw
          $controls = @('Family','Module','Priority','Direction','Grid','_legacySnap','_legacyTolerance')
          foreach($control in $controls) {
            if(-not $ui.Contains($control)) {throw "Missing control $control"}
          }
          Write-Host 'HCE DEMTC UI control inventory PASS: family/module/priority/direction/grid/snap/tolerance'

      - name: Verify six DEMTC mode mapping without changing protected Core
        shell: powershell
        run: |
          $root = 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD'
          $ui = Get-Content "$root/HceLegacyProfile.cs" -Raw
          $bridge = Get-Content "$root/Commands.cs" -Raw
          foreach ($required in @('Family = 610', 'MixedPrimaryMode.LargeMain', 'Module == "D" ? large : small', 'SnapTolerance = Tolerance')) {
            if (-not $ui.Contains($required)) { throw "Missing DEMTC UI setting $required" }
          }
          foreach ($required in @('profile.ToOptions()', 'TryExtractHatch(hatch, out input, out reason, profile.Family)', 'ref rejected, false, options', 'GridMode == "2"')) {
            if (-not $bridge.Contains($required)) { throw "Missing DEMTC bridge setting $required" }
          }
          Write-Host 'HCE six-mode command/UI wiring source check PASS; Golden fixture still runs with defaults.'

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Use canonical HNL VXT logo for HCE installer
        shell: powershell
        run: ./HCE-OVERLAY/scripts/apply-vxt-branding.ps1 -Root .

      - name: Verify package contract
        shell: powershell
        run: ./incubator/hnl-ceiling-estimator-pro/scripts/verify-universal.ps1 -Root ./incubator/hnl-ceiling-estimator-pro

      - name: Audit old DEMTC capability/options before UI restoration
        shell: powershell
        run: |
          $root='incubator/hnl-ceiling-estimator-pro'
          $sources=@(Get-ChildItem "$root/src" -Recurse -File -Filter '*.cs')
          $matches=@($sources | Select-String -Pattern 'class DemtcOptions','enum Module','enum Material','enum Packing','enum Grid' -List)
          Write-Host "HCE_OLD_OPTIONS_SOURCE_COUNT=$($matches.Count)"
          foreach($m in $matches) {
            Write-Host "HCE_OLD_OPTIONS_FILE=$($m.Path)"
            $lines=[IO.File]::ReadAllLines($m.Path)
            $start=[Math]::Max(0,$m.LineNumber-1)
            $end=[Math]::Min($lines.Length-1,$start+120)
            for($i=$start;$i -le $end;$i++) {
              Write-Host ("HCE_OPTION_SRC:{0}: {1}" -f ($i+1), $lines[$i])
            }
          }
          $lisp=@(Get-ChildItem $root -Recurse -File -Filter '*.lsp')
          Write-Host "HCE_LEGACY_LISP_FILES=$($lisp.Count)"
          foreach($f in $lisp) {Write-Host "LEGACY_LISP=$($f.FullName)"}

      - name: Inspect precise legacy option Core contract
        shell: powershell
        run: |
          $root='incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.Core'
          foreach($f in @(
            "$root/Models/DemtcOptions.cs",
            "$root/Models/StockSpec.cs",
            "$root/Models/MixedPrimaryMode.cs",
            "$root/DemtcEngine.cs"
          )) {
            if(Test-Path $f){
              Write-Host "HCE_CORE_CONTRACT_BEGIN $f"
              $lines=Get-Content $f
              $max=if($f -like '*DemtcEngine.cs'){[Math]::Min(210,$lines.Count)}else{$lines.Count}
              for($i=0;$i -lt $max;$i++){Write-Host "HCE_CORE_CODE:$($i+1): $($lines[$i])"}
              Write-Host "HCE_CORE_CONTRACT_END"
            }
          }
          Get-ChildItem $root -Recurse -File -Filter '*Mixed*' | ForEach-Object { Write-Host "HCE_MIXED_FILE $($_.FullName)" }

      - name: Inspect RC5.5 cut-piece/packing contracts without changing Core
        shell: powershell
        run: |
          $root='incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.Core'
          $hits=@(Get-ChildItem $root -Recurse -File -Filter '*.cs' | Select-String -Pattern 'class Piece','struct Piece','record Piece','class PackResult','class PackBin','PureFastResult' -List)
          foreach($hit in $hits) {
            Write-Host "HCE_RC55_CONTRACT_BEGIN $($hit.Path)"
            Get-Content $hit.Path | ForEach-Object { Write-Host "HCE_RC55_CODE: $_" }
            Write-Host 'HCE_RC55_CONTRACT_END'
          }
          if($hits.Count -lt 2){throw "RC5.5 contract inspection found only $($hits.Count) source files"}

      - name: Validate RC5.4.1 read-only Area/DXF43-44 diagnostics
        shell: powershell
        run: |
          $cmd=Get-Content 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/Commands.cs' -Raw
          foreach($phrase in @('PatternBaseText(hatch)', 'PatternBaseDeltaText(hatch)', 'areaSource=', 'phasePolicy=', 'GetPatternDefinitionAt(0)')) {
            if(-not $cmd.Contains($phrase)){throw "Missing RC5.4.1 diagnostic contract: $phrase"}
          }
          Write-Host 'HCE RC5.4.1 READ-ONLY AREA + DXF43/44 DIAGNOSTIC GATE PASS'

      - name: Core regression for six DEMTC modules with X/Y and priority S/D
        shell: powershell
        run: dotnet run --project HCE-OVERLAY/tests/LegacyModes/LegacyModes.csproj -c Release

      - name: Verify RC5.4 real per-DWG CAD Table display options
        shell: powershell
        run: |
          $root='incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD'
          $profile=Get-Content "$root/HceLegacyProfile.cs" -Raw
          $ui=Get-Content "$root/HcePaletteUi.cs" -Raw
          $cmd=Get-Content "$root/Commands.cs" -Raw
          foreach($v in @('TableTextStyle', 'TableTextHeight')) {
            if(-not $profile.Contains($v) -or -not $ui.Contains($v) -or -not $cmd.Contains($v)) { throw "Missing RC5.4 real table binding: $v" }
          }
          foreach($v in @('RefreshTableStyles', 'SaveLegacyTableHeight', 'TextStyleTable', 'Grid.SetColumn(_legacyTableHeight, 1)', 'cell.TextHeight', 'cell.TextStyleId')) {
            if(-not (($ui+$cmd).Contains($v))) { throw "Missing RC5.4 UI/adapter table setting: $v" }
          }
          $profile=Get-Content "$root/HceLegacyProfile.cs" -Raw
          foreach($part in @('LabelTextHeight', 'BuildLabelSpecs', 'PiecesInLispOrder()', 'BoundaryFullPieces.AddRange', 'LabelPointWcs', 'AddCadLabel(currentSpace, transaction', 'CellRange.Create(table', 'table.SetSize(rows, 4)', 'transaction.Commit();')) {
            if(-not (($ui+$cmd+$profile).Contains($part))){throw "Missing Vietnamese table or N/G/L label contract: $part"}
          }
          if($cmd.Contains('"Material / Hatch group"')){throw 'English CAD table headers not removed'}
          if(-not $ui.Contains('SaveLegacyLabelHeight')){throw 'N/G/L CAD text height editor missing'}
          foreach($part in @('CutListEnabled', 'CutListMode')) {
            if(-not $profile.Contains($part) -or -not $cmd.Contains($part)) { throw "Missing per-DWG cut list option: $part" }
          }
          foreach($part in @('SaveLegacyCutList', '_legacyCutMode', 'profile.CutListMode', '_legacyCutMode.IsEnabled = true', 'cutListLabel.MouseLeftButtonUp', 'cutModeLabel.MouseLeftButtonUp', 'profile.CutListEnabled = true;')) {
            if(-not $ui.Contains($part)) { throw "Missing summary/detail selector binding: $part" }
          }
          if($ui.Contains('_legacyCutMode.IsEnabled = profile.CutListEnabled')) { throw 'Cut list mode must not be disabled while checkbox is off' }
           foreach($part in @('Cut-piece list is OFF. Include in new Table', 'cutListChoice.Keywords.Add("Summary")',
                             'cutListChoice.Keywords.Add("Detail")', 'cutListChoice.Keywords.Add("NoList")',
                             'New Table cut-piece list:', 'Existing CAD tables are not modified.')) {
             if(-not $cmd.Contains($part)){ throw "Missing cut-list runtime fallback: $part" }
           }
           foreach($part in @(' | Liệt kê: ', 'chỉ áp dụng cho bảng mới.')) {
             if(-not $ui.Contains($part)){ throw "Missing cut-list UI applied-state indication: $part" }
           }
           foreach($part in @('BuildCutSizeRows', 'RoundCutDimension', 'MidpointRounding.AwayFromZero', 'cutRows.Count',
                            'SourceDisplay = sourceName', 'details.Count != expected',
                            'cutListIsDetailed ? "Mã"', 'detailedCount > 2000', 'table.MergeCells(CellRange.Create(table, cutHeadingRow')) {
            if(-not $cmd.Contains($part)) { throw "Missing LISP RC13 cut list parity contract: $part" }
          }
          if($cmd.Contains('engine.PackCutPieces(pieces')){throw 'Cut list must reuse original packed report'}
          foreach($part in @('HatchLoopTypes.NotClosed', 'flaggedNotClosed',
                 'nearClosedGapMm > 0.01', 'HasNonAdjacentIntersections(segments)',
                 'last.X1, last.Y1, first.X1, first.Y1',
                 'input.RecoveredNearClosed = flaggedNotClosed',
                 'Original DWG Hatch unchanged.')) {
            if(-not $cmd.Contains($part)){throw "Missing recoverable NotClosed Hatch safety gate: $part"}
          }
          $open=$cmd.IndexOf('var flaggedNotClosed = ')
          $closure=$cmd.IndexOf('segments[segments.Count - 1] = new Segment2(')
          $area=$cmd.IndexOf('stage = "Hatch.Area"')
          if($open -lt 0 -or $closure -lt $open -or $closure -ge $area){
            throw 'Near-closed seam must be validated and recovered before native Area'
          }
          if($cmd.Contains('repair Hatch boundary before ceiling quantities')){
            throw 'Obsolete blanket NotClosed rejection remains'
          }
          foreach($part in @('input.PatternBaseVerified = havePatternBase',
                 'new Point2(phaseX, phaseY)',
                 'TryGetFirstPatternBase(hatch, out phaseX, out phaseY)',
                 'profile.GridMode == "3" && input.UserGridVerified',
                 '!input.PatternBaseVerified',
                 'DXF 43/44 phase unavailable',
                 'phasePolicy=',
                 'grid anchored to DXF 43/44=')) {
            if(-not $cmd.Contains($part)) { throw "Missing HCE 43/44 phase safety contract: $part" }
          }
          if($cmd.Contains('phasePolicy=Hatch.Origin')) { throw 'Obsolete Hatch.Origin-only phase path' }
          if(-not $cmd.Contains('new GridFrame(havePatternBase')) { throw 'LISP phase not fed to actual Core GridFrame' }
          Write-Host 'HCE DXF 43/44 LISP PHASE ADAPTER REGRESSION STATIC GATE PASS'
          Write-Host 'HCE NOTCLOSED NEAR-SEAM RECOVERY SAFETY GATE PASS'
          Write-Host 'HCE RC13 CUT LIST SUMMARY/DETAIL UI + TABLE STATIC GATE PASS'
          Write-Host 'HCE VIETNAMESE TABLE + N/G/L LABEL + PER-DWG HEIGHT STATIC GATE PASS'
          # CAD Table Style and Text Style are independent, both resolved per DWG.
          foreach($v in @('CadTableStyle', 'TableStyleDictionaryId', 'CTABLESTYLE',
                 'RefreshCadTableStyles', '_legacyCadTableStyle', 'Table Style (bảng)')) {
            if(-not (($profile+$ui+$cmd).Contains($v))) { throw "Missing native CAD Table Style: $v" }
          }
          foreach($v in @('table.TableStyle = cadTableStyleId',
                 'FitHceTableToText(table, database, cadTableStyle',
                 'new MText()', 'probe.ActualWidth', 'probe.ActualHeight',
                 'table.SetColumnWidth(col, widths[col])',
                 'table.SetRowHeight(row, Math.Max(8.0, heights[row]))')) {
            if(-not $cmd.Contains($v)){ throw "Missing MTEXT auto sizing: $v" }
          }
          if($cmd.Contains('Result [Table/Exit]') -or $cmd.Contains('choiceOptions.Keywords.Add("Exit")')) {
            throw 'HCECALC must create directly after result computation (Esc at point still cancels)'
          }
          if($ui.Contains('Exit: không ghi DWG.')) { throw 'Obsolete Table/Exit palette hint' }
          Write-Host 'HCE NATIVE TABLE STYLE + MTEXT AUTOSIZE + DIRECT INSERTION GATE PASS'
          Write-Host 'HCE RC5.4 CAD TABLE STYLE/HEIGHT BINDING STATIC GATE PASS'

      - name: Build Golden + AutoCAD matrix + Setup EXE
        shell: powershell
        run: ./incubator/hnl-ceiling-estimator-pro/scripts/build-universal-installer.ps1 -Root ./incubator/hnl-ceiling-estimator-pro

      - name: Inspect bundled HCEUI command load policy
        shell: powershell
        run: |
          $root = 'incubator/hnl-ceiling-estimator-pro'
          $files = @(Get-ChildItem $root -Recurse -Filter 'PackageContents.xml' -File)
          Write-Host "HCE MANIFEST files=$($files.Count)"
          foreach ($f in $files) {
            Write-Host "--- HCE_MANIFEST $($f.FullName)"
            Get-Content $f.FullName | Select-Object -First 90 | ForEach-Object { Write-Host $_ }
          }

      - name: Certify embedded HCE setup icon against canonical VXT master
        shell: powershell
        run: |
          $setup = Get-ChildItem 'incubator/hnl-ceiling-estimator-pro/artifacts/universal-installer' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $setup) { throw 'HCE setup missing' }
          ./incubator/hnl-vxt-pro/scripts/verify-installer-icon.ps1 -ExePath $setup.FullName -IcoPath ./incubator/hnl-ceiling-estimator-pro/installer/assets/HNL-HCE.ico

      - name: Upload Universal Setup
        uses: actions/upload-artifact@v4
        with:
          name: HNL-Ceiling-Estimator-Pro-v0.3.0-Universal-AutoCAD2023-2027
          path: |
            incubator/hnl-ceiling-estimator-pro/artifacts/universal-installer/*
            incubator/hnl-ceiling-estimator-pro/HNL-HCE-v0.3.0-STATIC-REGRESSION.txt
          if-no-files-found: error