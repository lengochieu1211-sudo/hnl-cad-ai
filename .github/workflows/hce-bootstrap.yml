name: HCE Bootstrap Universal 2023-2027

on:
  push:
    branches: [research/hce-pro-bootstrap]
    paths:
      - 'HCE-PAYLOAD/**'
      - 'HCE-OVERLAY/**'
      - '.github/workflows/hce-bootstrap.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct HCE source payload
        shell: powershell
        run: |
          $parts = Get-ChildItem HCE-PAYLOAD\part-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\hce.zip", $bytes)
          New-Item -ItemType Directory -Force -Path incubator\hnl-ceiling-estimator-pro | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\hce.zip" incubator\hnl-ceiling-estimator-pro -Force

      - name: Inspect original HCE AutoCAD build project for Palette UI gate
        shell: powershell
        run: |
          $root = 'incubator/hnl-ceiling-estimator-pro'
          foreach ($file in @(
            "$root/src/Bridges/AutoCAD2023/HNL.CeilingEstimator.AutoCAD.2023.csproj",
            "$root/src/Bridges/AutoCAD2025/HNL.CeilingEstimator.AutoCAD.2025.csproj",
            "$root/src/HNL.CeilingEstimator.AutoCAD/HNL.CeilingEstimator.AutoCAD.csproj",
            "$root/Directory.Build.props",
            "$root/installer/HNL.CeilingEstimator.Universal.Setup.iss"
          )) {
            if (Test-Path $file) {
              Write-Host "--- HCE_BUILD_INSPECTION: $file"
              Get-Content $file | Select-Object -First 100 | ForEach-Object { Write-Host $_ }
            }
          }

      - name: Apply minimal AutoCAD adapter overlay (Core untouched)
        shell: powershell
        run: |
          $src = 'HCE-OVERLAY/src/HNL.CeilingEstimator.AutoCAD/Commands.cs'
          $dst = 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/Commands.cs'
          if (-not (Test-Path $src)) { throw 'Missing HCE runtime bridge overlay.' }
          Copy-Item $src $dst -Force
          Write-Host 'HCE bridge overlay applied; protected Core and Golden fixtures unchanged.'

      - name: Enable isolated HCE WPF Palette source for five AutoCAD bridge builds
        shell: powershell
        run: |
          $root = 'incubator/hnl-ceiling-estimator-pro'
          $overlay = 'HCE-OVERLAY/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs'
          $dst = "$root/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs"
          if (-not (Test-Path $overlay)) { throw 'Missing HCE palette overlay' }
          Copy-Item $overlay $dst -Force
          $projects = @(Get-ChildItem "$root/src/Bridges" -Filter 'HNL.CeilingEstimator.AutoCAD.*.csproj' -Recurse -File)
          if ($projects.Count -ne 5) { throw "Unexpected HCE bridge count: $($projects.Count)" }
          foreach ($p in $projects) {
            $xml = Get-Content $p.FullName -Raw
            if ($xml -match '<UseWPF>') { throw "Unexpected pre-existing WPF property in $($p.Name)" }
            $xml = $xml.Replace('<TargetFramework>', '<UseWPF>true</UseWPF>' + [Environment]::NewLine + '    <TargetFramework>')
            $resource = '<Resource Include="..\..\..\installer\assets\HNL-Logo-Official.png" Link="Assets\HNL-Logo-Official.png" />'
            $xml = $xml.Replace('</Project>', '  <ItemGroup>' + [Environment]::NewLine + '    ' + $resource + [Environment]::NewLine + '  </ItemGroup>' + [Environment]::NewLine + '</Project>')
            [IO.File]::WriteAllText($p.FullName, $xml, [Text.UTF8Encoding]::new($false))
            Write-Host "HCE PALETTE bridge enabled: $($p.Name)"
          }

      - name: Verify HCE default palette and calculator route
        shell: powershell
        run: |
          $commands = Get-Content 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/Commands.cs' -Raw
          $ui = Get-Content 'incubator/hnl-ceiling-estimator-pro/src/HNL.CeilingEstimator.AutoCAD/HcePaletteUi.cs' -Raw
          if ($commands -notmatch '\[CommandMethod\("HCE", CommandFlags.Modal\)\]') { throw 'HCE command missing' }
          if ($commands -notmatch 'public void Hce\(\) \{ new HcePaletteCommands\(\).Open\(\); \}') { throw 'HCE must open palette' }
          if ($commands -notmatch '\[CommandMethod\("HCECALC", CommandFlags.Modal\)\]') { throw 'HCECALC command missing' }
          if ($commands -notmatch 'public void HceCalculate\(\) \{ RunCeilingEstimator\(\); \}') { throw 'HCECALC must use original engine' }
          if ($ui -notmatch 'CommandButton\([^\r\n]+, "HCECALC", true\)') { throw 'HCE button must calculate, not reopen the palette' }
          Write-Host 'HCE command routing contract PASS: HCE => Palette; HCECALC => existing Core; UI => HCECALC.'

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Use canonical HNL VXT logo for HCE installer
        shell: powershell
        run: ./HCE-OVERLAY/scripts/apply-vxt-branding.ps1 -Root .

      - name: Verify package contract
        shell: powershell
        run: ./incubator/hnl-ceiling-estimator-pro/scripts/verify-universal.ps1 -Root ./incubator/hnl-ceiling-estimator-pro

      - name: Build Golden + AutoCAD matrix + Setup EXE
        shell: powershell
        run: ./incubator/hnl-ceiling-estimator-pro/scripts/build-universal-installer.ps1 -Root ./incubator/hnl-ceiling-estimator-pro

      - name: Inspect bundled HCEUI command load policy
        shell: powershell
        run: |
          $root = 'incubator/hnl-ceiling-estimator-pro'
          $files = @(Get-ChildItem $root -Recurse -Filter 'PackageContents.xml' -File)
          Write-Host "HCE MANIFEST files=$($files.Count)"
          foreach ($f in $files) {
            Write-Host "--- HCE_MANIFEST $($f.FullName)"
            Get-Content $f.FullName | Select-Object -First 90 | ForEach-Object { Write-Host $_ }
          }

      - name: Certify embedded HCE setup icon against canonical VXT master
        shell: powershell
        run: |
          $setup = Get-ChildItem 'incubator/hnl-ceiling-estimator-pro/artifacts/universal-installer' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $setup) { throw 'HCE setup missing' }
          ./incubator/hnl-vxt-pro/scripts/verify-installer-icon.ps1 -ExePath $setup.FullName -IcoPath ./incubator/hnl-ceiling-estimator-pro/installer/assets/HNL-HCE.ico

      - name: Upload Universal Setup
        uses: actions/upload-artifact@v4
        with:
          name: HNL-Ceiling-Estimator-Pro-v0.3.0-Universal-AutoCAD2023-2027
          path: |
            incubator/hnl-ceiling-estimator-pro/artifacts/universal-installer/*
            incubator/hnl-ceiling-estimator-pro/HNL-HCE-v0.3.0-STATIC-REGRESSION.txt
          if-no-files-found: error