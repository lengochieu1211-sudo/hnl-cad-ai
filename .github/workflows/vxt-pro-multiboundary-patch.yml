name: HNL VXT Apply Multi Boundary Parity Patch

on:
  push:
    branches:
      - research/vxt-pro-v7-bootstrap
    paths:
      - "incubator/hnl-vxt-pro/scripts/apply-multiboundary-parity.ps1"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply multi-polyline parity patch
        shell: pwsh
        run: '& "${{ github.workspace }}\incubator\hnl-vxt-pro\scripts\apply-multiboundary-parity.ps1" -RepoRoot "${{ github.workspace }}"'
      - name: Commit patched source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incubator/hnl-vxt-pro/src incubator/hnl-vxt-pro/tests
          if (git diff --cached --quiet) {
            Write-Host "No source changes required."
            exit 0
          }
          git commit -m "HNL VXT: restore multi-polyline Lisp parity"
          git push origin HEAD:research/vxt-pro-v7-bootstrap
