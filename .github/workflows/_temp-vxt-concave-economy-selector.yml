name: TEMP HNL VXT concave economy selector

on:
  push:
    branches:
      - research/vxt-pro-v7-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vxt-pro-v7-bootstrap
          fetch-depth: 0
      - name: Apply economy selector
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          dec = lambda x: base64.b64decode(x).decode('utf-8')
          old = dec("")
          new = dec("")
          helpers = dec("")
          tanchor = dec("ICAgICAgICBbVGVzdE1ldGhvZF0KICAgICAgICBwdWJsaWMgdm9pZCBGdXJyaW5nX0RlZmF1bHRJc0V4YWN0MTIyMERpdjNfQnV0UmVtYWluc1VzZXJFZGl0YWJsZSgp")
          tblock = dec("")

          p = Path('incubator/hnl-vxt-pro/src/HNL.VXT.Core/Preview/VxtConcaveMainPostProcessor.cs')
          s = p.read_text(encoding='utf-8')
          assert s.count(old) == 1, f'Expected one strategy block, got {s.count(old)}'
          s = s.replace(old, new, 1)
          anchor = '        private static void RebuildRegionalMains(\n'
          assert s.count(anchor) == 1, 'Could not locate RebuildRegionalMains anchor'
          s = s.replace(anchor, helpers + anchor, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('incubator/hnl-vxt-pro/tests/HNL.VXT.Core.Tests/EconomicLayoutTests.cs')
          s = p.read_text(encoding='utf-8')
          assert s.count(tanchor) == 1, 'Could not locate EconomicLayoutTests anchor'
          s = s.replace(tanchor, tblock + tanchor, 1)
          p.write_text(s, encoding='utf-8')
          print('Economy selector applied')
          PY
      - name: Commit economy selector
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incubator/hnl-vxt-pro/src/HNL.VXT.Core/Preview/VxtConcaveMainPostProcessor.cs \
                  incubator/hnl-vxt-pro/tests/HNL.VXT.Core.Tests/EconomicLayoutTests.cs
          git commit -m "HNL VXT: choose most economical valid concave strategy"
          git push origin HEAD:research/vxt-pro-v7-bootstrap
