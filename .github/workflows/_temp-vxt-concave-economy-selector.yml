name: TEMP HNL VXT concave economy selector

on:
  push:
    branches:
      - research/vxt-pro-v7-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vxt-pro-v7-bootstrap
          fetch-depth: 0

      - name: Apply concave economy strategy selector
        shell: python
        run: |
          from pathlib import Path

          p = Path('incubator/hnl-vxt-pro/src/HNL.VXT.Core/Preview/VxtConcaveMainPostProcessor.cs')
          s = p.read_text(encoding='utf-8')

          old = '''                    var obstacles = TransformMainObstacles(context, scope, settings);\n                    List<Segment2> regionSegments;\n                    if (VxtOrthogonalNotchRegionPlanner.TryBuild(\n                        scope.Polygon, scope.Domain, settings, obstacles, out regionSegments))\n                    {\n                        RebuildRegionalMains(plan, scope, regionSegments, settings, obstacles);\n                        return;\n                    }\n\n                    var moved = RebalanceGlobalGrid(grid, checks, scope.Domain, settings, obstacles);\n                    if (!SameGrid(grid, moved))\n                    {\n                        RebuildGlobalMains(plan, scope, moved, settings, obstacles);\n                        grid = moved;\n                    }\n                    AddLocalRepairs(plan, scope, grid, settings, obstacles);'''

          new = '''                    var obstacles = TransformMainObstacles(context, scope, settings);\n                    List<Segment2> regionSegments;\n                    var hasRegionalCandidate = VxtOrthogonalNotchRegionPlanner.TryBuild(\n                        scope.Polygon, scope.Domain, settings, obstacles, out regionSegments);\n\n                    // Candidate A: Lisp-first global rebalance, then the minimum local fallback only\n                    // when the global grid still cannot satisfy a real concave band.\n                    var moved = RebalanceGlobalGrid(grid, checks, scope.Domain, settings, obstacles);\n                    if (!SameGrid(grid, moved))\n                    {\n                        RebuildGlobalMains(plan, scope, moved, settings, obstacles);\n                        grid = moved;\n                    }\n                    AddLocalRepairs(plan, scope, grid, settings, obstacles);\n\n                    // Candidate B: automatic orthogonal-notch rectangle decomposition. Never choose\n                    // it blindly: safety is mandatory, then construction economy wins lexicographically\n                    // by fewer XC segments, fewer Ty, shorter total XC, and finally spacing nearer Max.\n                    // XP is not rebuilt by either candidate, so its one-side chase phase is preserved.\n                    if (hasRegionalCandidate)\n                    {\n                        var globalScore = ScoreMainStrategy(plan, scope, settings, obstacles);\n                        var regionalPlan = CloneForMainStrategy(plan);\n                        RebuildRegionalMains(regionalPlan, scope, regionSegments, settings, obstacles);\n                        var regionalScore = ScoreMainStrategy(regionalPlan, scope, settings, obstacles);\n                        if (regionalScore.IsBetterThan(globalScore))\n                            CopyMainAndHangers(plan, regionalPlan);\n                    }'''

          assert s.count(old) == 1, f'Expected one strategy block, got {s.count(old)}'
          s = s.replace(old, new, 1)

          anchor = '''        private static void RebuildRegionalMains(\n'''
          assert s.count(anchor) == 1, 'Could not locate RebuildRegionalMains anchor.'
          helpers = r'''        private static VxtPreviewPlan CloneForMainStrategy(VxtPreviewPlan source)
        {
            var clone = new VxtPreviewPlan();
            clone.Lines.AddRange(source.Lines);
            clone.Texts.AddRange(source.Texts);
            clone.HangerPoints.AddRange(source.HangerPoints);
            clone.Dimensions.AddRange(source.Dimensions);
            clone.MainSegmentCount = source.MainSegmentCount;
            clone.FurringSegmentCount = source.FurringSegmentCount;
            clone.HangerCount = source.HangerCount;
            clone.DimensionSegmentCount = source.DimensionSegmentCount;
            clone.Quality = source.Quality;
            return clone;
        }

        private static void CopyMainAndHangers(VxtPreviewPlan target, VxtPreviewPlan source)
        {
            target.Lines.RemoveAll(x => x.Kind == PreviewLineKind.Main || x.Kind == PreviewLineKind.Hanger);
            target.Lines.AddRange(source.Lines.Where(x =>
                x.Kind == PreviewLineKind.Main || x.Kind == PreviewLineKind.Hanger));
            target.HangerPoints.Clear();
            target.HangerPoints.AddRange(source.HangerPoints);
            target.MainSegmentCount = source.MainSegmentCount;
            target.HangerCount = source.HangerCount;
        }

        private static StrategyScore ScoreMainStrategy(
            VxtPreviewPlan candidate,
            Scope scope,
            VxtSettings settings,
            List<Box2> obstacles)
        {
            var mains = candidate.Lines.Where(x => x.Kind == PreviewLineKind.Main).ToList();
            var violations = CountMainConstraintViolations(candidate, scope, settings);

            if (settings.UseAvoidance && obstacles != null && obstacles.Count > 0)
            {
                foreach (var line in mains)
                {
                    var a = Transform2.ToLocal(line.A, scope.Radians);
                    var b = Transform2.ToLocal(line.B, scope.Radians);
                    if (Math.Abs(a.Y - b.Y) > 0.5 ||
                        !LocalSegmentClear(new Segment2(a, b), obstacles))
                        violations++;
                }
            }

            var totalLength = mains.Sum(x => x.A.DistanceTo(x.B));
            var spacingSlack = CalculateSpacingSlack(candidate, scope, settings);
            return new StrategyScore(
                violations,
                mains.Count,
                candidate.HangerPoints.Count,
                totalLength,
                spacingSlack);
        }

        private static int CountMainConstraintViolations(
            VxtPreviewPlan candidate,
            Scope scope,
            VxtSettings settings)
        {
            var violations = 0;
            foreach (var check in CollectChecks(scope))
            {
                var sampleX = (check.BandA + check.BandB) * 0.5;
                var ys = UniqueSort(candidate.Lines
                    .Where(x => x.Kind == PreviewLineKind.Main)
                    .Select(x => new
                    {
                        A = Transform2.ToLocal(x.A, scope.Radians),
                        B = Transform2.ToLocal(x.B, scope.Radians)
                    })
                    .Where(x => Math.Abs(x.A.Y - x.B.Y) <= 0.5 &&
                                sampleX >= Math.Min(x.A.X, x.B.X) - Tol &&
                                sampleX <= Math.Max(x.A.X, x.B.X) + Tol)
                    .Select(x => (x.A.Y + x.B.Y) * 0.5)
                    .Where(y => y >= check.A - Tol && y <= check.B + Tol), 0.5);
                violations += CountIntervalViolations(ys, check.A, check.B, settings);
            }
            return violations;
        }

        private static int CountIntervalViolations(
            IReadOnlyList<double> grid,
            double a,
            double b,
            VxtSettings settings)
        {
            if (grid == null || grid.Count == 0) return 1;
            var violations = 0;
            var maxEdge = settings.MainMaxEdgeOffset + Math.Max(0.0, settings.MainEdgeTolerance);
            var firstEdge = grid[0] - a;
            var lastEdge = b - grid[grid.Count - 1];
            if (firstEdge < settings.MainMinEdgeOffset - Tol || firstEdge > maxEdge + Tol) violations++;
            if (lastEdge < settings.MainMinEdgeOffset - Tol || lastEdge > maxEdge + Tol) violations++;
            for (var i = 0; i + 1 < grid.Count; i++)
            {
                var gap = grid[i + 1] - grid[i];
                if (gap < settings.MainMinSpacing - Tol || gap > settings.MainMaxSpacing + Tol)
                    violations++;
            }
            return violations;
        }

        private static double CalculateSpacingSlack(
            VxtPreviewPlan candidate,
            Scope scope,
            VxtSettings settings)
        {
            var slack = 0.0;
            foreach (var check in CollectChecks(scope))
            {
                var sampleX = (check.BandA + check.BandB) * 0.5;
                var ys = UniqueSort(candidate.Lines
                    .Where(x => x.Kind == PreviewLineKind.Main)
                    .Select(x => new
                    {
                        A = Transform2.ToLocal(x.A, scope.Radians),
                        B = Transform2.ToLocal(x.B, scope.Radians)
                    })
                    .Where(x => Math.Abs(x.A.Y - x.B.Y) <= 0.5 &&
                                sampleX >= Math.Min(x.A.X, x.B.X) - Tol &&
                                sampleX <= Math.Max(x.A.X, x.B.X) + Tol)
                    .Select(x => (x.A.Y + x.B.Y) * 0.5)
                    .Where(y => y >= check.A - Tol && y <= check.B + Tol), 0.5);
                for (var i = 0; i + 1 < ys.Count; i++)
                    slack += Math.Max(0.0, settings.MainMaxSpacing - (ys[i + 1] - ys[i]));
            }
            return slack;
        }

        private sealed class StrategyScore
        {
            public StrategyScore(
                int violationCount,
                int mainCount,
                int hangerCount,
                double mainLength,
                double spacingSlack)
            {
                ViolationCount = violationCount;
                MainCount = mainCount;
                HangerCount = hangerCount;
                MainLength = mainLength;
                SpacingSlack = spacingSlack;
            }

            public int ViolationCount { get; }
            public int MainCount { get; }
            public int HangerCount { get; }
            public double MainLength { get; }
            public double SpacingSlack { get; }

            public bool IsBetterThan(StrategyScore other)
            {
                if (other == null) return true;
                if (ViolationCount != other.ViolationCount)
                    return ViolationCount < other.ViolationCount;
                if (MainCount != other.MainCount)
                    return MainCount < other.MainCount;
                if (HangerCount != other.HangerCount)
                    return HangerCount < other.HangerCount;
                if (Math.Abs(MainLength - other.MainLength) > Tol)
                    return MainLength < other.MainLength;
                if (Math.Abs(SpacingSlack - other.SpacingSlack) > Tol)
                    return SpacingSlack < other.SpacingSlack;
                return false;
            }
        }

'''
          s = s.replace(anchor, helpers + anchor, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('incubator/hnl-vxt-pro/tests/HNL.VXT.Core.Tests/EconomicLayoutTests.cs')
          s = p.read_text(encoding='utf-8')
          anchor = '''        [TestMethod]\n        public void Furring_DefaultIsExact1220Div3_ButRemainsUserEditable()'''
          assert s.count(anchor) == 1, 'Could not locate EconomicLayoutTests insertion anchor.'
          test = '''        [TestMethod]\n        public void OrthogonalNotch_EconomyPrefersFewerMainSegmentsThenHangers()\n        {\n            var settings = new VxtSettings\n            {\n                DrawFurring = false,\n                DrawHangers = true,\n                AutoDimension = true,\n                DimMain = true,\n                DimHanger = true,\n                UseLocalMainAdd = true\n            };\n\n            var notch = new Boundary2(new[]\n            {\n                new Point2(0, 1500),\n                new Point2(2500, 1500),\n                new Point2(2500, 0),\n                new Point2(6000, 0),\n                new Point2(6000, 4000),\n                new Point2(0, 4000)\n            });\n\n            var plan = VxtMultiBoundaryPlanBuilder.Build(\n                new[] { notch }, settings, new VxtLayoutContext());\n\n            Assert.AreEqual(5, plan.Lines.Count(x => x.Kind == PreviewLineKind.Main),\n                "When global rebalance and rectangular decomposition are both valid, the strategy with fewer XC segments must win.");\n            Assert.AreEqual(29, plan.HangerPoints.Count,\n                "After minimizing XC, the selected strategy must keep the corresponding minimum legal Ty layout.");\n        }\n\n'''
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s, encoding='utf-8')

          print('Concave economy strategy selector patch applied.')

      - name: Commit economy selector
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incubator/hnl-vxt-pro/src/HNL.VXT.Core/Preview/VxtConcaveMainPostProcessor.cs \
                  incubator/hnl-vxt-pro/tests/HNL.VXT.Core.Tests/EconomicLayoutTests.cs
          git commit -m "HNL VXT: choose most economical valid concave strategy"
          git push origin HEAD:research/vxt-pro-v7-bootstrap
