name: TEMP HNL VXT concave rebalance regression fixture

on:
  push:
    branches:
      - research/vxt-pro-v7-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vxt-pro-v7-bootstrap
          fetch-depth: 0
      - name: Move legacy rebalance regression to non-orthogonal concave fixture
        shell: python
        run: |
          from pathlib import Path
          p = Path('incubator/hnl-vxt-pro/tests/HNL.VXT.Core.Tests/ConcavePostProcessTests.cs')
          s = p.read_text(encoding='utf-8')
          old = '''var plan = VxtMultiBoundaryPlanBuilder.Build(\n                new[] { LowerLeftNotch() }, settings, new VxtLayoutContext());'''
          new = '''var plan = VxtMultiBoundaryPlanBuilder.Build(\n                new[] { NonOrthogonalLowerLeftNotch() }, settings, new VxtLayoutContext());'''
          marker = 'public void ConcaveBand_AutoDimensionStillRebalancesGlobalXcBeforeAddingLocalBar()'
          pos = s.index(marker)
          block_end = s.index('[TestMethod]', pos + len(marker))
          block = s[pos:block_end]
          assert block.count(old) == 1, 'Expected first rebalance test to use LowerLeftNotch once.'
          block = block.replace(old, new, 1)
          s = s[:pos] + block + s[block_end:]

          anchor = '''private static Boundary2 LowerLeftNotch()\n            => new Boundary2(new[]\n            {'''
          helper = '''private static Boundary2 NonOrthogonalLowerLeftNotch()\n            => new Boundary2(new[]\n            {\n                new Point2(0, 1500),\n                new Point2(2500, 1500),\n                new Point2(2500, 0),\n                new Point2(6000, 0),\n                new Point2(6000, 3900),\n                new Point2(5900, 4000),\n                new Point2(0, 4000)\n            });\n\n        private static Boundary2 LowerLeftNotch()\n            => new Boundary2(new[]\n            {'''
          assert s.count(anchor) == 1, 'Could not locate LowerLeftNotch helper anchor.'
          s = s.replace(anchor, helper, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit regression fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incubator/hnl-vxt-pro/tests/HNL.VXT.Core.Tests/ConcavePostProcessTests.cs
          git commit -m "HNL VXT: separate orthogonal regions from concave rebalance regression"
          git push origin HEAD:research/vxt-pro-v7-bootstrap
