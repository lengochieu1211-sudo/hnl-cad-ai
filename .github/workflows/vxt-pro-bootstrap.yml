name: HNL VXT Pro v7 Bootstrap CI

on:
  push:
    branches:
      - research/vxt-pro-v7-bootstrap
    paths:
      - "incubator/hnl-vxt-pro/**"
      - ".github/workflows/vxt-pro-bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "incubator/hnl-vxt-pro/**"
      - ".github/workflows/vxt-pro-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: AutoCAD 2023 Build / Core Tests / Bundle
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      VXT_ROOT: ${{ github.workspace }}\incubator\hnl-vxt-pro

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Toolchain and source gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet --info
          Write-Host "Target: AutoCAD 2023 / .NET Framework 4.8 / AutoCAD.NET 24.2.0"
          $required = @(
            "$env:VXT_ROOT\src\HNL.VXT.Core\HNL.VXT.Core.csproj",
            "$env:VXT_ROOT\src\HNL.VXT.UI\HNL.VXT.UI.csproj",
            "$env:VXT_ROOT\src\HNL.VXT.AutoCAD\HNL.VXT.AutoCAD.csproj",
            "$env:VXT_ROOT\src\HNL.VXT.AutoCAD\VxtTransientPreview.cs",
            "$env:VXT_ROOT\src\HNL.VXT.UI\Controls\HnlLogo.xaml",
            "$env:VXT_ROOT\tests\HNL.VXT.Core.Tests\HNL.VXT.Core.Tests.csproj",
            "$env:VXT_ROOT\build\HNL.VXT.bundle\PackageContents.xml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required VXT source: $file" }
          }
          $createSource = Get-Content "$env:VXT_ROOT\src\HNL.VXT.UI\ViewModels\VxtPaletteViewModel.cs" -Raw
          if (-not $createSource.Contains("public bool CanCreate => false")) {
            throw "Safety gate failed: real Create must remain locked in alpha.1."
          }
          Write-Host "HNL VXT source/safety gate PASS"

      - name: Restore AutoCAD 2023 plugin
        shell: pwsh
        run: dotnet restore "$env:VXT_ROOT\src\HNL.VXT.AutoCAD\HNL.VXT.AutoCAD.csproj"

      - name: Restore core tests
        shell: pwsh
        run: dotnet restore "$env:VXT_ROOT\tests\HNL.VXT.Core.Tests\HNL.VXT.Core.Tests.csproj"

      - name: Build AutoCAD 2023 plugin
        shell: pwsh
        run: dotnet build "$env:VXT_ROOT\src\HNL.VXT.AutoCAD\HNL.VXT.AutoCAD.csproj" -c Release --no-restore

      - name: Run Core / Geometry / DIM tests
        shell: pwsh
        run: dotnet test "$env:VXT_ROOT\tests\HNL.VXT.Core.Tests\HNL.VXT.Core.Tests.csproj" -c Release

      - name: Package AutoCAD ApplicationPlugins bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:VXT_ROOT "artifacts"
          $bundleRoot = Join-Path $artifactRoot "HNL.VXT.bundle"
          $windows = Join-Path $bundleRoot "Contents\Windows"
          if (Test-Path $artifactRoot) { Remove-Item $artifactRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $windows | Out-Null

          Copy-Item "$env:VXT_ROOT\build\HNL.VXT.bundle\PackageContents.xml" "$bundleRoot\PackageContents.xml" -Force

          $out = "$env:VXT_ROOT\src\HNL.VXT.AutoCAD\bin\Release\net48"
          if (-not (Test-Path $out)) { throw "Missing AutoCAD Release output: $out" }
          Get-ChildItem $out -File | Where-Object {
            $_.Extension -in @('.dll', '.pdb', '.config') -and $_.Name -notmatch '^(Ac|AutoCAD).*\.dll$'
          } | Copy-Item -Destination $windows -Force

          $bad = Get-ChildItem $windows -File | Where-Object { $_.Name -match '^(Ac|AutoCAD).*\.dll$' }
          if ($bad) { throw "Autodesk runtime DLL detected in distributable bundle." }

          foreach ($requiredDll in @('HNL.VXT.AutoCAD.dll','HNL.VXT.Core.dll','HNL.VXT.UI.dll')) {
            if (-not (Test-Path (Join-Path $windows $requiredDll))) { throw "Missing bundle DLL: $requiredDll" }
          }

          $dll = Join-Path $windows "HNL.VXT.AutoCAD.dll"
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll))
          Write-Host "HNL.VXT.AutoCAD.dll FileVersion: $($info.FileVersion)"
          if (-not $info.FileVersion.StartsWith("7.0.0")) { throw "Unexpected VXT DLL version: $($info.FileVersion)" }

          $zip = Join-Path $artifactRoot "HNL-VXT-Pro-v7.0.0-alpha.1-AutoCAD2023.zip"
          Compress-Archive -Path $bundleRoot -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Write-Host "Artifact SHA256: $hash"
          Write-Host "HNL VXT bundle gate PASS"

      - name: Upload HNL VXT Pro AutoCAD 2023 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNL-VXT-Pro-v7.0.0-alpha.1-AutoCAD2023
          path: ${{ env.VXT_ROOT }}/artifacts/HNL-VXT-Pro-v7.0.0-alpha.1-AutoCAD2023.zip
          if-no-files-found: error
          retention-days: 7
