name: HNL VXT Pro v7 Bootstrap CI

on:
  push:
    branches:
      - research/vxt-pro-v7-bootstrap
    paths:
      - "VXT-PRO-PAYLOAD/**"
      - ".github/workflows/vxt-pro-bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "VXT-PRO-PAYLOAD/**"
      - ".github/workflows/vxt-pro-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: AutoCAD 2023 Build / Core Tests / Bundle
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reconstruct verified HNL VXT source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "ec1d55fd6bff549ba9a963528e73ca2d8e833f492f654397cb21799c1d41c0ac"
          $parts = Get-ChildItem "VXT-PRO-PAYLOAD/part-*.b64" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected exactly 5 VXT payload parts, found $($parts.Count)." }

          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("vxt-source.zip", $bytes)

          $actual = (Get-FileHash "vxt-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "VXT source SHA256: $actual"
          if ($actual -ne $expected) { throw "VXT source SHA256 mismatch. Expected $expected, got $actual" }

          if (Test-Path ".vxt-extracted") { Remove-Item ".vxt-extracted" -Recurse -Force }
          Expand-Archive "vxt-source.zip" -DestinationPath ".vxt-extracted" -Force
          $root = Get-ChildItem ".vxt-extracted" -Directory | Select-Object -First 1
          if (-not $root) { throw "VXT source root was not found after extraction." }
          "VXT_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VXT source root: $($root.FullName)"

      - name: Toolchain
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "Target: AutoCAD 2023 / .NET Framework 4.8 / AutoCAD.NET 24.2.0"

      - name: Validate source tree
        shell: pwsh
        run: '& "$env:VXT_ROOT\scripts\validate-source.ps1" -Root $env:VXT_ROOT'

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:VXT_ROOT\HNL.VXT.sln"

      - name: Build full solution
        shell: pwsh
        run: dotnet build "$env:VXT_ROOT\HNL.VXT.sln" -c Release --no-restore

      - name: Run Core / Geometry / DIM tests
        shell: pwsh
        run: dotnet test "$env:VXT_ROOT\tests\HNL.VXT.Core.Tests\HNL.VXT.Core.Tests.csproj" -c Release --no-build

      - name: Package AutoCAD ApplicationPlugins bundle
        shell: pwsh
        run: '& "$env:VXT_ROOT\scripts\package.ps1" -Configuration Release -Root $env:VXT_ROOT'

      - name: Verify bundle safety and version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:VXT_ROOT "artifacts\HNL.VXT.bundle\Contents\Windows"
          $bad = Get-ChildItem $bundle -File | Where-Object { $_.Name -match '^(Ac|AutoCAD).*\.dll$' }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "Unexpected Autodesk runtime DLL: $($_.Name)" }
            throw "Do not redistribute Autodesk runtime DLLs."
          }

          $dll = Join-Path $bundle "HNL.VXT.AutoCAD.dll"
          if (!(Test-Path $dll)) { throw "Missing HNL.VXT.AutoCAD.dll in bundle." }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll))
          Write-Host "HNL.VXT.AutoCAD.dll FileVersion: $($info.FileVersion)"
          if (-not $info.FileVersion.StartsWith("7.0.0")) { throw "Unexpected VXT DLL version: $($info.FileVersion)" }
          Write-Host "HNL VXT bundle dependency/version gate PASS"

      - name: Upload HNL VXT Pro AutoCAD 2023 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNL-VXT-Pro-v7.0.0-alpha.1-AutoCAD2023
          path: ${{ env.VXT_ROOT }}/artifacts/HNL-VXT-Pro-v7.0.0-alpha.1-AutoCAD2023.zip
          if-no-files-found: error
          retention-days: 7
